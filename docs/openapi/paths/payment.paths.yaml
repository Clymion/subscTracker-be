/payments:
  get:
    tags:
      - 支払い履歴
    summary: 支払い履歴一覧の取得
    description: 支払い履歴の一覧を取得します
    operationId: getPayments
    security:
      - bearerAuth: []
    parameters:
      - name: subscription_id
        in: query
        description: サブスクリプションID
        schema:
          type: string
      - name: start_date
        in: query
        description: 検索開始日 (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        description: 検索終了日 (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - name: payment_method
        in: query
        description: 支払い方法
        schema:
          type: string
      - name: currency
        in: query
        description: 通貨
        schema:
          type: string
      - name: limit
        in: query
        description: 取得件数
        schema:
          type: integer
          default: 100
      - name: offset
        in: query
        description: オフセット
        schema:
          type: integer
          default: 0
      - name: sort_by
        in: query
        description: ソート対象カラム
        schema:
          type: string
          default: 'payment_date'
      - name: sort_order
        in: query
        description: ソート順
        schema:
          type: string
          default: 'desc'
    responses:
      '200':
        description: 正常に取得しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    payments:
                      type: array
                      items:
                        $ref: '../components/schemas/payment.schemas.yaml#/Payment'
                meta:
                  $ref: '../components/schemas/common.schemas.yaml#/Meta'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
  post:
    tags:
      - 支払い履歴
    summary: 支払い記録の作成
    description: 新しい支払い記録を作成します
    operationId: createPayment
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment.schemas.yaml#/PaymentCreateRequest'
    responses:
      '201':
        description: 正常に作成しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/payment.schemas.yaml#/Payment'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
'/payments/{id}':
  patch:
    tags:
      - 支払い履歴
    summary: 支払い記録の更新
    description: 指定された支払い記録を更新します
    operationId: updatePayment
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        description: 支払いID
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/payment.schemas.yaml#/PaymentUpdateRequest'
    responses:
      '200':
        description: 正常に更新しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/payment.schemas.yaml#/Payment'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  delete:
    tags:
      - 支払い履歴
    summary: 支払い記録の削除
    description: 指定された支払い記録を削除します
    operationId: deletePayment
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        description: 支払いID
        required: true
        schema:
          type: string
    responses:
      '204':
        description: 正常に削除しました
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
