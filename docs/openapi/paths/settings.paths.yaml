'/users/{userId}/settings/currency':
  get:
    tags:
      - 通貨設定
    summary: 通貨設定の取得
    description: 指定されたユーザーの通貨設定を取得します
    operationId: getCurrencySettings
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        description: ユーザーID
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 正常に取得しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/settings.schemas.yaml#/CurrencySettings'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  patch:
    tags:
      - 通貨設定
    summary: 通貨設定の更新
    description: 指定されたユーザーの通貨設定を更新します
    operationId: updateCurrencySettings
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        description: ユーザーID
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/settings.schemas.yaml#/CurrencySettingsUpdateRequest'
    responses:
      '200':
        description: 正常に更新しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/settings.schemas.yaml#/CurrencySettings'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
/exchange-rates:
  get:
    tags:
      - 通貨設定
    summary: 為替レートの取得
    description: 指定された日付と通貨の為替レートを取得します。日付を指定しない場合は最新のレートを返します。
    operationId: getExchangeRates
    security:
      - bearerAuth: []
    parameters:
      - name: date
        in: query
        description: 取得する為替レートの日付 (YYYY-MM-DD)。指定しない場合は最新の日付。
        required: false
        schema:
          type: string
          format: date
      - name: base_currency
        in: query
        description: 基準とする通貨コード (3文字のISO 4217コード)。指定しない場合はユーザーの基本設定通貨。
        required: false
        schema:
          type: string
          example: 'JPY'
      - name: target_currencies
        in: query
        description: 取得したい通貨コードのカンマ区切りリスト。指定しない場合は全ての利用可能な通貨。
        required: false
        schema:
          type: string
          example: 'USD,EUR,KRW'
    responses:
      '200':
        description: 為替レートの取得に成功しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/exchange_rate.schemas.yaml#/ExchangeRate'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

'/exchange-rates/refresh':
  post:
    tags:
      - 通貨設定
    summary: 為替レートの手動更新
    description: 為替レートを手動で更新します
    operationId: refreshExchangeRates
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 正常に更新しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    updated_at:
                      type: string
                      format: date-time
                    rates:
                      type: object
                      additionalProperties:
                        type: number
                      examples:
                        USD: 1
                        JPY: 148.5
                        EUR: 0.92
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
'/users/{userId}/payment-methods':
  get:
    tags:
      - 支払い方法設定
    summary: 支払い方法一覧の取得
    description: 指定されたユーザーの支払い方法一覧を取得します
    operationId: getPaymentMethods
