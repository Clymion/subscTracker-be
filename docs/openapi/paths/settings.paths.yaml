          schema:
            $ref: '../components/schemas/settings.schemas.yaml#/PaymentMethodCreateRequest'
    responses:
      '201':
        description: 正常に追加しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/settings.schemas.yaml#/PaymentMethod'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
'/users/{userId}/payment-methods/{id}':
  patch:
    tags:
      - 支払い方法設定
    summary: 支払い方法の更新
    description: 指定された支払い方法を更新します
    operationId: updatePaymentMethod
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        description: ユーザーID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: 支払い方法ID
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              is_default:
                type: boolean
                description: デフォルトの支払い方法として設定するかどうか
            required:
              - is_default
    responses:
      '200':
        description: 正常に更新しました
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '../components/schemas/settings.schemas.yaml#/PaymentMethod'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
  delete:
    tags:
      - 支払い方法設定
    summary: 支払い方法の削除
    description: 指定された支払い方法を削除します
    operationId: deletePaymentMethod
    security:
      - bearerAuth: []
    parameters:
      - name: userId
        in: path
        description: ユーザーID
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: 支払い方法ID
        required: true
        schema:
          type: string
    responses:
      '204':
        description: 正常に削除しました
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
