ExchangeRate:
  type: object
  properties:
    date:
      type: string
      format: date
      description: 為替レートの基準日
    base_currency:
      type: string
      description: 基準通貨
      example: 'JPY'
    rates:
      type: object
      description: 各通貨の基準通貨に対する為替レート
      additionalProperties:
        type: number
        format: float
      example:
        USD: 0.0067
        EUR: 0.0062
  required:
    - date
    - base_currency
    - rates
