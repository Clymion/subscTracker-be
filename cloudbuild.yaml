steps:
  # ステップ1: 本番イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/Dockerfile'
      - '--target=production'
      - '-t'
      # イメージ名 「リージョン-docker.pkg.dev/プロジェクトID/リポジトリ名/イメージ名:タグ」
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '.'

  # ステップ2: ビルドしたイメージをArtifact Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'

  # ステップ3: 新しいイメージを使ってCloud Runにデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--min-instances=0'
      - '--allow-unauthenticated'
      # 環境変数を設定
      - '--set-env-vars=DB_DRIVER=mysql,DB_SSL_CA=/etc/ssl/certs/tidb_ca.crt'
      # Secret Managerから秘密情報を環境変数としてセットする
      - '--set-secrets=JWT_SECRET_KEY=JWT_SECRET_KEY:latest'
      - '--set-secrets=DB_HOST=DB_HOST:latest'
      - '--set-secrets=DB_PORT=DB_PORT:latest'
      - '--set-secrets=DB_USER=DB_USER:latest'
      - '--set-secrets=DB_PASSWORD=DB_PASSWORD:latest'
      - '--set-secrets=DB_NAME=DB_NAME:latest'

  # ステップ4: Cloud Run Job を更新（為替レート取得バッチ）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'subsc-tracker-fetch-rate'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--task-timeout=300s'
      - '--set-env-vars=DB_DRIVER=mysql,DB_SSL_CA=/etc/ssl/certs/tidb_ca.crt'
      - '--set-secrets=JWT_SECRET_KEY=JWT_SECRET_KEY:latest'
      - '--set-secrets=EXCHANGERATE_API_KEY=EXCHANGERATE_API_KEY:latest'
      - '--set-secrets=DB_HOST=DB_HOST:latest'
      - '--set-secrets=DB_PORT=DB_PORT:latest'
      - '--set-secrets=DB_USER=DB_USER:latest'
      - '--set-secrets=DB_PASSWORD=DB_PASSWORD:latest'
      - '--set-secrets=DB_NAME=DB_NAME:latest'

  # ステップ5: Cloud Run Job を更新（支払い履歴登録バッチ）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'subsc-tracker-payment-history'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--task-timeout=300s'
      - '--set-env-vars=DB_DRIVER=mysql,DB_SSL_CA=/etc/ssl/certs/tidb_ca.crt'
      - '--set-secrets=JWT_SECRET_KEY=JWT_SECRET_KEY:latest'
      - '--set-secrets=DB_HOST=DB_HOST:latest'
      - '--set-secrets=DB_PORT=DB_PORT:latest'
      - '--set-secrets=DB_USER=DB_USER:latest'
      - '--set-secrets=DB_PASSWORD=DB_PASSWORD:latest'
      - '--set-secrets=DB_NAME=DB_NAME:latest'

# ビルドしたイメージを保存しておく設定
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO_NAME}/${_IMAGE_NAME}:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
